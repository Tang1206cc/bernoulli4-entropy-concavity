name: Verify exact certificates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the certificates and manuscript tables
        run: python proof/verify_all.py
      - name: Check the classification independently
        run: python proof/independent_classification_check.py
      - name: Check optimized-execution guards
        run: |
          python - <<'PY'
          import subprocess
          import sys

          scripts = ('verify_all.py', 'classification.py', 'analytic_proof.py',
                     'curvature_certificate.py', 'manuscript_tables.py')
          for flag in ('-O', '-OO'):
              for script in scripts:
                  result = subprocess.run(
                      [sys.executable, flag, 'proof/' + script],
                      capture_output=True, text=True)
                  output = result.stdout + result.stderr
                  if result.returncode == 0 or 'Run without -O' not in output:
                      raise SystemExit(f'Optimization guard failed: {flag} {script}\n{output}')
          print('All assertion-based command-line entry points reject -O and -OO.')
          PY
